  function hearts(n, src) {
    for (var i = 0; i < n; i++) {
      var e = document.createElement("span");
      e.className = "fl";
      e.textContent = src[i % src.length];
      e.style.left = Math.random() * 100 + "vw";
      e.style.fontSize = 14 + Math.random() * 22 + "px";
      e.style.animationDuration = 7 + Math.random() * 8 + "s";
      e.style.animationDelay = Math.random() * 5 + "s";
      document.body.appendChild(e);
      setTimeout(function(x) { x.remove(); }, 16000, e);
    }
  }

  function burst(x, y, n) {
    var s = ["💗", "🪿", "✨", "💌", "🤍"];
    for (var i = 0; i < (n || 18); i++) {
      var e = document.createElement("span");
      e.className = "pop";
      e.textContent = s[i % 5];
      e.style.left = x + "px";
      e.style.top = y + "px";
      var a = Math.random() * 6.28;
      var d = 80 + Math.random() * 140;
      e.style.setProperty("--dx", Math.cos(a) * d + "px");
      e.style.setProperty("--dy", Math.sin(a) * d - 40 + "px");
      e.style.setProperty("--r", Math.random() * 360 - 180 + "deg");
      document.body.appendChild(e);
      setTimeout(function(z) { z.remove(); }, 1500, e);
    }
  }

  function nav(back, next, label) {
    return '<div class="nav">' + (back ? '<button class="btn ghost" data-go="-1">Back</button>' : '<span></span>') + '<button class="btn" data-go="1">' + label + '</button></div>';
  }

  var busy = false;
  function go(d) {
    var ns = Math.max(0, Math.min(TOTAL - 1, S.step + d));
    if (busy || ns === S.step) return;
    busy = true;
    view.style.setProperty("--ox", d > 0 ? "-44px" : "44px");
    view.classList.add("out");
    setTimeout(function() {
      S.step = ns;
      view.classList.remove("out");
      view.style.setProperty("--dx", d > 0 ? "48px" : "-48px");
      window.scrollTo(0, 0);
      draw();
      if (Math.random() < 0.45) setTimeout(rona, 700);
      busy = false;
    }, 300);
  }

  function draw() {
    dots();
    var h = "";

    if (S.step === 0) {
      h = '<p class="script hi">Rana,</p>' +
          '<div class="giftwrap">' +
            '<svg class="gift" viewBox="0 0 220 200" role="img" aria-label="A wrapped gift">' +
              '<ellipse cx="110" cy="190" rx="70" ry="7" class="g-sh"/>' +
              '<rect x="40" y="98" width="140" height="88" rx="10" class="g-body"/>' +
              '<rect x="100" y="98" width="20" height="88" class="g-rib"/>' +
              '<path d="M118 100Q134 104 140 120" fill="none" stroke="var(--muted)" stroke-width="1.3"/>' +
              '<g transform="rotate(9 154 136)"><rect x="130" y="118" width="48" height="28" rx="5" class="g-tag"/><text x="154" y="138" text-anchor="middle" class="g-txt">Rana</text></g>' +
              '<g class="hrt"><path d="M0 -4C-4 -14 -18 -10 -14 2C-12 8 -4 14 0 18C4 14 12 8 14 2C18 -10 4 -14 0 -4Z" class="g-heart"/></g>' +
              '<g class="lid"><rect x="32" y="72" width="156" height="30" rx="8" class="g-lid"/><rect x="100" y="72" width="20" height="30" class="g-rib"/><path d="M110 72C82 24 46 52 100 72Z" class="g-bow"/><path d="M110 72C138 24 174 52 120 72Z" class="g-bow"/><circle cx="110" cy="70" r="8" class="g-knot"/></g>' +
            '</svg>' +
          '</div>' +
          '<h1>A Gift To Me Inside A Gift From Me</h1>' +
          '<p class="lead">Hai babi, you told me you wanted gift and to be spoilt but u also didnt want to just receive and not give so i made you a gift that lets you make a gift for me as well SOOOO BABBI try it asf.</p>' +
          '<p class="script ask">Ready to open it?</p>' +
          '<div class="askrow">' +
            '<button class="btn big" id="yes">YES ASF</button>' +
            '<button class="btn ghost" id="wait">no and i hate my buf</button>' +
          '</div>';
    }

    if (S.step === 1) {
      h = '<p class="script">Step 1: the review</p>' +
          '<h2>How am i doin?</h2>' +
          '<p class="muted">give me 10 in everyting or i kill you.</p>' +
          CATS.map(function(c, i) {
            return '<div class="card">' +
                     '<div class="rate-top"><strong>' + esc(c) + '</strong><span class="num" id="n' + i + '">' + S.r[i] + '</span></div>' +
                     '<input type="range" min="1" max="10" value="' + S.r[i] + '" data-r="' + i + '" aria-label="' + esc(c) + '">' +
                     '<span class="chip" id="t' + i + '">' + tag(S.r[i]) + '</span>' +
                   '</div>';
          }).join("") + nav(1, 1, "go next step cutie");
    }

    if (S.step === 2) {
      h = '<p class="script">Step 2: the love letter</p>' +
          '<h2>Tell me Rona Sheesham</h2>' +
          '<div class="card"><label for="a1"><strong>' + PROMPTS[0] + '</strong></label><textarea id="a1" placeholder="yea type it out like a good girl">' + esc(S.a1) + '</textarea></div>' +
          '<div class="card"><label for="ldr_mem"><strong>' + PROMPTS[1] + '</strong></label><textarea id="ldr_mem" placeholder="our sleep calls, late games, synced movies...">' + esc(S.ldr_mem) + '</textarea></div>' +
          '<div class="card"><label for="ldr_close"><strong>' + PROMPTS[2] + '</strong></label><textarea id="ldr_close" placeholder="goodnight texts, random voice notes...">' + esc(S.ldr_close) + '</textarea></div>' +
          '<div class="card"><strong>Pick 3 words that best describe how I make you feel despite the distance.</strong>' +
            '<div class="words" style="margin-top:10px">' +
              [0, 1, 2].map(function(i) {
                return '<input type="text" maxlength="24" data-w="' + i + '" value="' + esc(S.w[i]) + '" placeholder="word ' + (i + 1) + '" aria-label="Word ' + (i + 1) + '">';
              }).join("") +
            '</div>' +
          '</div>' +
          '<div class="card"><label for="a3"><strong>' + PROMPTS[3] + '</strong></label><textarea id="a3" placeholder="ur such a good girl keep going for daddy 😏">' + esc(S.a3) + '</textarea></div>' +
          '<div class="card"><label for="signName"><strong>What name do you want to sign the letter with?</strong></label><input id="signName" type="text" maxlength="80" value="' + esc(S.signName) + '" placeholder="Darab"></div>' +
          '<div class="card"><label for="endPara"><strong>What extra paragraph do you want to add at the end of the letter?</strong></label><textarea id="endPara" placeholder="Write anything you want them to read at the end of the letter...">' + esc(S.endPara) + '</textarea></div>' +
          nav(1, 1, "On to our reunion");
    }

    if (S.step === 3) {
      h = '<p class="script">Step 3: our first reunion agenda</p>' +
          '<h2>When we finally meet…</h2>' +
          '<p class="muted">Tap what you want. Every “YES ASF” goes straight into the letter.</p>' +
          AGENDA.map(function(a, i) {
            return '<button class="tog" data-g="' + i + '" aria-pressed="' + S.g[i] + '"><span>' + a + '</span><span class="pill">' + (S.g[i] ? "YES ASF" : "Maybe later") + '</span></button>';
          }).join("") + nav(1, 1, "Seal the letter 💌");
    }

    if (S.step === 4) {
      h = '<div style="text-align:center">' +
            '<p class="script">Step 4: the reveal</p>' +
            '<h2>A letter is waiting, Rona Sheesham</h2>' +
          '</div>' +
          '<div class="env-container">' +
            '<div class="env" id="env">' +
              '<div class="back"></div>' +
              '<div class="flap"></div>' +
              '<div class="front"></div>' +
              '<button class="seal" id="seal" aria-label="Break the seal"></button>' +
            '</div>' +
          '</div>' +
          '<p class="hint muted" id="hint">Tap the heart seal to open your letter 💖</p>' +
          '<div id="out"></div>';
    }

    view.innerHTML = h;
    view.classList.toggle("land", S.step === 0);
    Array.prototype.forEach.call(view.children, function(c, i) {
      c.style.animationDelay = Math.min(i, 8) * 70 + "ms";
    });
  }

  function letter() {
    var avg = S.r.reduce(function(a, b) { return a + b; }, 0) / S.r.length;
    var words = S.w.filter(Boolean);
    var picked = AGENDA.filter(function(_, i) { return S.g[i]; });

    var rows = CATS.map(function(c, i) {
      return '<div class="rl"><span>' + esc(c) + '</span><strong>' + S.r[i] + '/10</strong></div><div class="bar"><b data-w="' + (S.r[i] * 10) + '"></b></div>';
    }).join("");

    return '<article class="letter">' +
             '<p class="script" style="margin:0">Dear Rana,</p>' +
             '<p>this is ur exam result bab</p>' +
             '<h2 style="font-size:1.4rem;margin-top:18px">Your review of Darab</h2>' +
             rows +
             '<p><strong>Overall: ' + avg.toFixed(1) + ' / 10.</strong> ' + (avg >= 9 ? "Certified Goose-approved. YES ASF." : avg >= 7 ? "fuh u gimme max" : "Room to grow, and I’m already on it.") + '</p>' +
             '<h2 style="font-size:1.4rem;margin-top:18px">Your words</h2>' +
             '<p class="q">' + PROMPTS[0] + '</p>' +
             '<blockquote>' + (esc(S.a1) || "ur NOT funny") + '</blockquote>' +
             '<p class="q">' + PROMPTS[1] + '</p>' +
             '<blockquote>' + (esc(S.ldr_mem) || "im gonna stab you") + '</blockquote>' +
             '<p class="q">' + PROMPTS[2] + '</p>' +
             '<blockquote>' + (esc(S.ldr_close) || "ur litr never getting spanked again") + '</blockquote>' +
             '<p class="q">How I make you feel, in three words</p>' +
             '<blockquote>' + (words.length ? esc(words.join(" · ")) : "litr gonna kill you") + '</blockquote>' +
             '<p class="q">' + PROMPTS[3] + '</p>' +
             '<blockquote>' + (esc(S.a3) || "litr kys") + '</blockquote>' +
             '<h2 style="font-size:1.4rem;margin-top:18px">Our first reunion agenda</h2>' +
             (picked.length ? '<ul>' + picked.map(function(p) { return '<li>' + p + ' <span class="chip">YES ASF</span></li>'; }).join("") + '</ul>' : '<p>DO IT PROPERLY U FAGGOT</p>') +
             (S.endPara.trim() ? '<p class="custom-end" style="white-space:pre-wrap">' + esc(S.endPara) + '</p>' : '') +
             '<p class="sign">Yours, ' + esc(S.signName.trim() || "Darab") + '</p>' +
           '</article>' +
           '<div class="card" style="margin-top:24px;">' +
             '<p class="script" style="margin-top:0">P.S. just for you 💗</p>' +
             '<p>my rona sheesham, im so excited to meet you babbyyy and be able to touch u and lick you and put my fingers in ur nose litr im so excited babe. no but fr im really excited to meet you my pretty angel i cant wait to have my pretty girl in my arms and ill finally be able to kiss my baby girllllll</p>' +
             '<p style="text-align:center;font-weight:700;margin-top:16px;">LUH U BAB 🪿💗</p>' +
           '</div>' +
           '<div class="nav" style="justify-content:center;flex-wrap:wrap;margin-top:20px;">' +
             '<button class="btn" id="share">Share letter 💌</button>' +
             '<button class="btn ghost" id="export">Export letter .txt</button>' +
             '<button class="btn ghost" id="again">Start over ↺</button>' +
           '</div>';
  }

  view.addEventListener("input", function(e) {
    var t = e.target;
    if (t.dataset.r !== undefined) {
      var i = +t.dataset.r;
      S.r[i] = +t.value;
      $("#n" + i).textContent = t.value;
      var c = $("#t" + i);
      var nt = tag(+t.value);
      if (c.textContent !== nt) {
        c.textContent = nt;
        bump(c);
      }
    } else if (t.dataset.w !== undefined) {
      S.w[+t.dataset.w] = t.value;
    } else if (t.id === "a1") {
      S.a1 = t.value;
    } else if (t.id === "ldr_mem") {
      S.ldr_mem = t.value;
    } else if (t.id === "ldr_close") {
      S.ldr_close = t.value;
    } else if (t.id === "a3") {
      S.a3 = t.value;
    } else if (t.id === "signName") {
      S.signName = t.value;
    } else if (t.id === "endPara") {
      S.endPara = t.value;
    }
  });

  view.addEventListener("click", function(e) {
    var b = e.target.closest("button");
    if (!b) return;

    if (b.id === "yes") {
      if (busy) return;
      busy = true;
      var g = $(".gift");
      g.classList.add("open");
      var gr = g.getBoundingClientRect();
      burst(gr.left + gr.width / 2, gr.top + gr.height * 0.45, 22);
      setTimeout(function() {
        busy = false;
        go(1);
      }, 950);
    } else if (b.id === "wait") {
      say("Press the button or u die nigga");
    } else if (b.dataset.go) {
      var q = b.getBoundingClientRect();
      burst(q.left + q.width / 2, q.top + q.height / 2, 8);
      go(+b.dataset.go);
    } else if (b.dataset.g !== undefined) {
      var i = +b.dataset.g;
      S.g[i] = !S.g[i];
      b.setAttribute("aria-pressed", S.g[i]);
      var pl = $(".pill", b);
      pl.textContent = S.g[i] ? "YES ASF" : "Maybe later";
      bump(pl);
      if (S.g[i]) {
        var r = b.getBoundingClientRect();
        burst(r.right - 50, r.top + 20);
      }
    } else if (b.id === "seal") {
      var r2 = b.getBoundingClientRect();
      burst(r2.left + 37, r2.top + 37);
      
      // Trigger canvas confetti if available
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 }
        });
      }

      $("#env").classList.add("open");
      if ($("#hint")) $("#hint").remove();

      setTimeout(function() {
        $("#out").innerHTML = letter();
        hearts(16, ["💗", "🪿", "🤍"]);
        $("#out").scrollIntoView({ behavior: "smooth", block: "start" });
        setTimeout(function() {
          document.querySelectorAll(".bar b").forEach(function(x) {
            x.style.width = x.dataset.w + "%";
          });
        }, 300);
      }, 900);
    } else if (b.id === "share" || b.id === "export") {
      // Only the generated letter is shared/exported; the separate P.S. stays private.
      var letterEl = view.querySelector("article.letter");
      var letterText = letterEl ? letterEl.innerText : "";
      if (b.id === "share") {
        if (navigator.share) {
          navigator.share({
            title: 'A Gift To Me Inside A Gift From Me — Letter',
            text: letterText
          }).catch(function() {});
        } else {
          var dummy = document.createElement("textarea");
          document.body.appendChild(dummy);
          dummy.value = letterText;
          dummy.select();
          document.execCommand("copy");
          document.body.removeChild(dummy);
          say("Letter copied to clipboard! 💌");
        }
      } else {
        var blob = new Blob([letterText], { type: "text/plain;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = "rona-sheesham-love-letter.txt";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        say("Your letter is exported! 💌");
      }
    } else if (b.id === "again") {
      S = {
        step: 0,
        r: [7, 7, 7, 7, 7],
        a1: "",
        ldr_mem: "",
        ldr_close: "",
        w: ["", "", ""],
        a3: "",
        signName: "Darab",
        endPara: "",
        g: AGENDA.map(function() { return false; })
      };
      go(-4);
    }
  });

  hearts(12, ["💗", "🤍", "✨", "🌸"]);
  draw();
  setTimeout(rona, 4000);
  loop();
})();
</script>
</body>
</html>
